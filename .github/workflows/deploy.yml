name: Deploy to GitHub Pages

on:
  push:
    branches: ["**"]
  # 允许在 Actions 页面手动触发一次部署
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只保留最新一次部署，旧的直接取消
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # 仓库默认分支名字不确定（main / master / 其它），所以只在推送到默认分支时部署；
    # 手动触发（workflow_dispatch）则按当前分支部署，方便先发个预览确认没问题。
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Vite 8 要求 Node 20.19+ / 22.12+
          node-version: 22
          cache: npm

      - run: npm ci

      # 构建前先跑统计口径回归，失败就不部署
      - run: npm test

      - run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
